version: 1
# Amplify CI builds the FRONTEND only. The backend (under amplify/) is deployed
# out-of-band from a dev machine via ampx, and amplify_outputs.json is committed
# to the repo. There is intentionally no backend phase here — it never ran in CI.
frontend:
    phases:
        preBuild:
            commands:
                # Reuse the image's Node 22 if present; only install as a fallback.
                - nvm use 22 2>/dev/null || nvm install 22
                - npm install --no-audit --no-fund --prefer-offline
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            - node_modules/**/*
            - .npm/**/*
