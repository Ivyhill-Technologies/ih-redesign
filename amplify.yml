version: 1
# Amplify Hosting builds and serves the static site only. The contact form
# backend is a Lambda managed by Terraform in infra/ (not deployed here).
frontend:
    phases:
        preBuild:
            commands:
                # Node 26 (with libatomic) comes from the custom build image,
                # public.ecr.aws/docker/library/node:26-trixie, set by the
                # _CUSTOM_IMAGE env var in the Amplify console. Fail fast if not.
                - 'node -v | grep -q "^v26\." || { echo "Expected Node 26 from the custom build image (_CUSTOM_IMAGE)"; exit 1; }'
                # Strict install from the lockfile.
                - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            # npm ci wipes node_modules, so cache npm's download cache instead.
            - .npm/**/*
