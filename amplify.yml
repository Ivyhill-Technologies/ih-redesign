version: 1
# Amplify Hosting builds and serves the static site only. The contact form
# backend is a Lambda managed by Terraform in infra/ (not deployed here).
frontend:
    phases:
        preBuild:
            commands:
                # Node 26 binaries need libatomic, which the default Amplify image lacks.
                - sudo -n dnf install -y -q libatomic
                # Reuse the image's Node 26 if present; only install as a fallback.
                - nvm use 26 2>/dev/null || nvm install 26
                # Strict install from the lockfile.
                - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            # npm ci wipes node_modules, so cache npm's download cache instead.
            - .npm/**/*
