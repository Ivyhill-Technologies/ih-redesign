version: 1
# Amplify CI builds the FRONTEND only. The backend (under amplify/) is deployed
# out-of-band from a dev machine via ampx, and amplify_outputs.json is committed
# to the repo. There is intentionally no backend phase here — it never ran in CI.
frontend:
    phases:
        preBuild:
            commands:
                # Node 26 binaries need libatomic, which the default Amplify image lacks.
                - dnf install -y -q libatomic || yum install -y -q libatomic
                # Reuse the image's Node 26 if present; only install as a fallback.
                - nvm use 26 2>/dev/null || nvm install 26
                # Strict install from the lockfile. Backend tooling lives in
                # amplify/package.json and is not installed here.
                - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            # npm ci wipes node_modules, so cache npm's download cache instead.
            - .npm/**/*
