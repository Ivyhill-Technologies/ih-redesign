version: 1
backend:
    phases:
        build:
            commands:
                - |
                    # Skip backend deploy when nothing under amplify/ changed.
                    # CDK synth + diff round-trip is the biggest single time sink.
                    git fetch --unshallow 2>/dev/null || true
                    if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- amplify/; then
                        echo "No changes under amplify/ — skipping backend deploy"
                    else
                        echo "Backend changes detected — running deploy"
                        # Use the image's Node 22 if present; only install as a fallback.
                        nvm use 22 2>/dev/null || nvm install 22
                        npm install --no-audit --no-fund --prefer-offline
                        npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
                    fi
frontend:
    phases:
        preBuild:
            commands:
                # Don't re-download Node: reuse the image's version, install only as fallback.
                - nvm use 22 2>/dev/null || nvm install 22
                # npm install (not ci) so the cached node_modules is reused instead of wiped.
                - npm install --no-audit --no-fund --prefer-offline
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            - node_modules/**/*
            - .npm/**/*
