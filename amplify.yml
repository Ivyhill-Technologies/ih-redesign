version: 1
backend:
    phases:
        preBuild:
            commands:
                - curl https://mise.run | sh
                - export PATH="$HOME/.local/bin:$PATH"
                - mise install
        build:
            commands:
                - export PATH="$HOME/.local/bin:$PATH"
                - mise exec -- npm ci --no-audit --no-fund --cache .npm --prefer-offline
                - mise exec -- npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
    phases:
        preBuild:
            commands:
                - curl https://mise.run | sh
                - export PATH="$HOME/.local/bin:$PATH"
                - mise install
                - mise exec -- npm ci --no-audit --no-fund --cache .npm --prefer-offline
        build:
            commands:
                - export PATH="$HOME/.local/bin:$PATH"
                - mise exec -- npm run build
    artifacts:
        baseDirectory: dist
        files:
            - "**/*"
    cache:
        paths:
            - node_modules/**/*
            - .npm/**/*
            - $HOME/.local/share/mise/**/*
