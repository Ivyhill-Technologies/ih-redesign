<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Semantic + Steel</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .tile {
            border: 1px solid var(--border-1);
            border-radius: 4px;
            overflow: hidden;
        }
        .tile .fill {
            height: 56px;
        }
        .tile .meta {
            padding: 8px 10px;
        }
        .tile .name {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg-1);
        }
        .tile .hex {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-3);
            margin-top: 2px;
        }
        .tile .role {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--fg-4);
            margin-bottom: 2px;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="grid">
                <div class="tile">
                    <div class="fill" style="background:#1F4E79"></div>
                    <div class="meta">
                        <div class="role">Info</div>
                        <div class="name">Gov Blue</div>
                        <div class="hex">#1F4E79</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#2F7A2F"></div>
                    <div class="meta">
                        <div class="role">Success</div>
                        <div class="name">Compliance</div>
                        <div class="hex">#2F7A2F</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#B8860B"></div>
                    <div class="meta">
                        <div class="role">Warning</div>
                        <div class="name">Goldenrod</div>
                        <div class="hex">#B8860B</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#9B2C2C"></div>
                    <div class="meta">
                        <div class="role">Danger</div>
                        <div class="name">Burgundy</div>
                        <div class="hex">#9B2C2C</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#0E1A2B"></div>
                    <div class="meta">
                        <div class="role">Steel · 900</div>
                        <div class="name">Inverse panels</div>
                        <div class="hex">#0E1A2B</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#16263D"></div>
                    <div class="meta">
                        <div class="role">Steel · 800</div>
                        <div class="name">Footer / authority</div>
                        <div class="hex">#16263D</div>
                    </div>
                </div>
                <div class="tile">
                    <div class="fill" style="background:#1F3556"></div>
                    <div class="meta">
                        <div class="role">Steel · 700</div>
                        <div class="name">Inverse hover</div>
                        <div class="hex">#1F3556</div>
                    </div>
                </div>
                <div class="tile">
                    <div
                        class="fill"
                        style="background:#FFFFFF; border-right:1px solid #E5E7EB"
                    ></div>
                    <div class="meta">
                        <div class="role">Surface</div>
                        <div class="name">Page · white</div>
                        <div class="hex">#FFFFFF</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
