<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Brand colors</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .swatch {
            flex: 1;
            min-width: 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-1);
        }
        .swatch .fill {
            height: 78px;
        }
        .swatch .meta {
            padding: 8px 10px;
        }
        .swatch .name {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg-1);
        }
        .swatch .hex {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-3);
            margin-top: 2px;
        }
        .swatch.primary .meta {
            background: var(--ivy-green-50);
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="row">
                <div class="swatch primary">
                    <div class="fill" style="background:#80B941"></div>
                    <div class="meta">
                        <div class="name">Ivyhill Green · 500</div>
                        <div class="hex">#80B941 · primary</div>
                    </div>
                </div>
                <div class="swatch">
                    <div class="fill" style="background:#6BA033"></div>
                    <div class="meta">
                        <div class="name">Green · 600</div>
                        <div class="hex">#6BA033 · hover</div>
                    </div>
                </div>
                <div class="swatch">
                    <div class="fill" style="background:#4F7A22"></div>
                    <div class="meta">
                        <div class="name">Green · 700</div>
                        <div class="hex">#4F7A22 · pressed / link</div>
                    </div>
                </div>
                <div class="swatch">
                    <div class="fill" style="background:#9BC966"></div>
                    <div class="meta">
                        <div class="name">Green · 400</div>
                        <div class="hex">#9BC966</div>
                    </div>
                </div>
                <div class="swatch">
                    <div class="fill" style="background:#EEF6E2"></div>
                    <div class="meta">
                        <div class="name">Green · 100</div>
                        <div class="hex">#EEF6E2</div>
                    </div>
                </div>
                <div class="swatch">
                    <div class="fill" style="background:#F7FBF0"></div>
                    <div class="meta">
                        <div class="name">Green · 50</div>
                        <div class="hex">#F7FBF0</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
