<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cards</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        body {
            background: #f9fafb;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .dscard {
            background: #fff;
            border: 1px solid var(--border-1);
            border-radius: 4px;
            padding: 24px;
        }
        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--fg-3);
            margin-bottom: 10px;
        }
        .t {
            font-size: 18px;
            font-weight: 600;
            color: var(--fg-1);
            margin: 0 0 6px;
            line-height: 1.25;
        }
        .d {
            font-size: 13px;
            color: var(--fg-3);
            line-height: 1.5;
            margin: 0;
        }
        .acc {
            background: #fff;
            border: 1px solid var(--border-1);
            border-left: 2px solid #80b941;
            border-radius: 4px;
            padding: 20px 22px;
        }
        .q {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--fg-1);
            line-height: 1.4;
            margin: 0 0 8px;
        }
        .attr {
            font-size: 12px;
            color: var(--fg-4);
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="row">
                <div class="dscard">
                    <div class="eyebrow">Capability</div>
                    <h3 class="t">Document Conversion</h3>
                    <p class="d">
                        Scanning, imaging, and Intelligent Word Recognition for
                        federal records at agency scale.
                    </p>
                </div>
                <div class="acc">
                    <p class="q">
                        "Ivyhill digitized 2.4M pages on schedule and within
                        budget for our records modernization."
                    </p>
                    <div class="attr">Past performance · DOJ · 2023</div>
                </div>
            </div>
        </div>
    </body>
</html>
