<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Form inputs</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }
        .lab {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg-1);
        }
        .input,
        .select,
        .textarea {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--fg-1);
            padding: 10px 12px;
            border: 1px solid var(--border-2);
            border-radius: 4px;
            background: #fff;
            box-shadow: inset 0 0 0 1px rgba(11, 18, 32, 0.02);
            width: 100%;
            outline: none;
        }
        .input:focus {
            border-color: var(--ivy-green-500);
            box-shadow: 0 0 0 3px rgba(128, 185, 65, 0.35);
        }
        .helper {
            font-size: 12px;
            color: var(--fg-4);
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--fg-1);
        }
        .cb {
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-2);
            border-radius: 2px;
            background: #fff;
        }
        .cb.checked {
            background: #80b941;
            border-color: #80b941;
            position: relative;
        }
        .cb.checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="row">
                <div class="field">
                    <div class="lab">Agency / organization</div>
                    <input class="input" value="U.S. Department of Labor">
                    <div class="helper">
                        Required for capability statement requests.
                    </div>
                </div>
                <div class="field">
                    <div class="lab">Contract vehicle</div>
                    <select class="select">
                        <option>GSA MAS · 47QTCA20D00AG</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <div class="lab">Statement of work summary</div>
                <textarea class="textarea" rows="2">
                    Records digitization, NARA-aligned disposition schedules,
                    ~2.4M physical pages.
                </textarea>
            </div>
            <div class="checkbox">
                <span class="cb checked"></span>I confirm this inquiry concerns
                a federal contracting matter.
            </div>
        </div>
    </body>
</html>
