<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Icon mark</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .row {
            display: flex;
            gap: 24px;
            align-items: flex-end;
            padding: 8px 0;
        }
        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .tile img {
            display: block;
        }
        .lab {
            font-size: 11px;
            color: var(--fg-4);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .dark {
            background: #0e1a2b;
            padding: 16px;
            border-radius: 4px;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="row">
                <div class="tile">
                    <img
                        src="../assets/icon-color-large.png"
                        width="80"
                        height="80"
                    >
                    <div class="lab">80px</div>
                </div>
                <div class="tile">
                    <img
                        src="../assets/icon-color-medium.png"
                        width="48"
                        height="48"
                    >
                    <div class="lab">48px</div>
                </div>
                <div class="tile">
                    <img
                        src="../assets/icon-color-small.png"
                        width="32"
                        height="32"
                    >
                    <div class="lab">32px</div>
                </div>
                <div class="tile">
                    <img
                        src="../assets/icon-color-xsmall.png"
                        width="20"
                        height="20"
                    >
                    <div class="lab">20px favicon</div>
                </div>
                <div class="tile">
                    <div class="dark">
                        <img
                            src="../assets/icon-color-large.png"
                            width="48"
                            height="48"
                        >
                    </div>
                    <div class="lab">on steel</div>
                </div>
            </div>
        </div>
    </body>
</html>
