<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Spacing scale</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item {
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            align-items: center;
            gap: 12px;
        }
        .bar {
            height: 16px;
            background: var(--ivy-green-500);
            border-radius: 2px;
        }
        .tok {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-3);
        }
        .name {
            font-size: 12px;
            color: var(--fg-1);
            font-weight: 500;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="list">
                <div class="item">
                    <span class="name">--sp-1</span>
                    <div class="bar" style="width:4px"></div>
                    <span class="tok">4px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-2</span>
                    <div class="bar" style="width:8px"></div>
                    <span class="tok">8px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-3</span>
                    <div class="bar" style="width:12px"></div>
                    <span class="tok">12px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-4</span>
                    <div class="bar" style="width:16px"></div>
                    <span class="tok">16px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-5</span>
                    <div class="bar" style="width:24px"></div>
                    <span class="tok">24px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-6</span>
                    <div class="bar" style="width:32px"></div>
                    <span class="tok">32px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-7</span>
                    <div class="bar" style="width:48px"></div>
                    <span class="tok">48px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-8</span>
                    <div class="bar" style="width:64px"></div>
                    <span class="tok">64px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-9</span>
                    <div class="bar" style="width:96px"></div>
                    <span class="tok">96px</span>
                </div>
                <div class="item">
                    <span class="name">--sp-10</span>
                    <div class="bar" style="width:128px"></div>
                    <span class="tok">128px</span>
                </div>
            </div>
        </div>
    </body>
</html>
