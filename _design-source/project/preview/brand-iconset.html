<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Lucide icons</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 14px;
        }
        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .box {
            width: 100%;
            aspect-ratio: 1;
            border: 1px solid var(--border-1);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-1);
        }
        .lab {
            font-size: 10px;
            color: var(--fg-4);
        }
        .svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="grid">
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <path d="M3 9h18M9 21V9" />
                        </svg>
                    </div>
                    <div class="lab">layout</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                            />
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
                        </svg>
                    </div>
                    <div class="lab">file-text</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                            />
                        </svg>
                    </div>
                    <div class="lab">shield</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z"
                            />
                            <path
                                d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"
                            />
                        </svg>
                    </div>
                    <div class="lab">globe</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <ellipse cx="12" cy="5" rx="9" ry="3" />
                            <path
                                d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"
                            />
                        </svg>
                    </div>
                    <div class="lab">database</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3"
                            />
                            <path d="M21 4v5h-5M3 20v-5h5" />
                        </svg>
                    </div>
                    <div class="lab">refresh</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path d="M3 3v18h18" />
                            <path d="M7 14l4-4 4 4 5-5" />
                        </svg>
                    </div>
                    <div class="lab">trending</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M12 2L4 6v6c0 5 4 9 8 10 4-1 8-5 8-10V6z"
                            />
                            <path d="M9 12l2 2 4-4" />
                        </svg>
                    </div>
                    <div class="lab">verified</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="M2 8h20" />
                        </svg>
                    </div>
                    <div class="lab">terminal</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                            />
                        </svg>
                    </div>
                    <div class="lab">message</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"
                            />
                        </svg>
                    </div>
                    <div class="lab">briefcase</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M9 11H5a2 2 0 0 0-2 2v7h18v-7a2 2 0 0 0-2-2h-4M9 11V5a3 3 0 0 1 6 0v6"
                            />
                        </svg>
                    </div>
                    <div class="lab">archive</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>
                    <div class="lab">clock</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"
                            />
                        </svg>
                    </div>
                    <div class="lab">grid</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <path
                                d="M21 11.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"
                            />
                            <path d="M16 14l3 3 4-4" />
                        </svg>
                    </div>
                    <div class="lab">file-check</div>
                </div>
                <div class="tile">
                    <div class="box">
                        <svg class="svg" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M21 21l-5-5" />
                        </svg>
                    </div>
                    <div class="lab">search</div>
                </div>
            </div>
        </div>
    </body>
</html>
