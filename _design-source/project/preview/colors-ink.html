<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ink scale</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .scale {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 4px;
        }
        .s {
            border-radius: 2px;
            height: 64px;
            position: relative;
            border: 1px solid var(--border-1);
        }
        .s .h {
            position: absolute;
            bottom: 4px;
            left: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .s .n {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 10px;
            font-weight: 600;
        }
        .dark .h,
        .dark .n {
            color: rgba(255, 255, 255, 0.85);
        }
        .light .h,
        .light .n {
            color: var(--fg-2);
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="scale">
                <div class="s dark" style="background:#0B1220">
                    <div class="n">1000</div>
                    <div class="h">0B1220</div>
                </div>
                <div class="s dark" style="background:#111827">
                    <div class="n">900</div>
                    <div class="h">111827</div>
                </div>
                <div class="s dark" style="background:#1F2937">
                    <div class="n">800</div>
                    <div class="h">1F2937</div>
                </div>
                <div class="s dark" style="background:#374151">
                    <div class="n">700</div>
                    <div class="h">374151</div>
                </div>
                <div class="s dark" style="background:#4B5563">
                    <div class="n">600</div>
                    <div class="h">4B5563</div>
                </div>
                <div class="s dark" style="background:#6B7280">
                    <div class="n">500</div>
                    <div class="h">6B7280</div>
                </div>
                <div class="s light" style="background:#9CA3AF">
                    <div class="n">400</div>
                    <div class="h">9CA3AF</div>
                </div>
                <div class="s light" style="background:#D1D5DB">
                    <div class="n">300</div>
                    <div class="h">D1D5DB</div>
                </div>
                <div class="s light" style="background:#E5E7EB">
                    <div class="n">200</div>
                    <div class="h">E5E7EB</div>
                </div>
                <div class="s light" style="background:#F3F4F6">
                    <div class="n">100</div>
                    <div class="h">F3F4F6</div>
                </div>
                <div class="s light" style="background:#F9FAFB">
                    <div class="n">50</div>
                    <div class="h">F9FAFB</div>
                </div>
            </div>
        </div>
    </body>
</html>
