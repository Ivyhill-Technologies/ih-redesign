<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Heading scale</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .row2 {
            display: grid;
            grid-template-columns: 1fr 200px;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-1);
        }
        .row2:last-child {
            border: 0;
        }
        .spec {
            color: var(--fg-1);
        }
        .meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-4);
            text-align: right;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="row2">
                <div
                    class="spec"
                    style="font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-0.01em"
                >
                    Capabilities and past performance
                </div>
                <div class="meta">H2 · 28/32 · 600</div>
            </div>
            <div class="row2">
                <div
                    class="spec"
                    style="font-size:20px;font-weight:600;line-height:1.3"
                >
                    Records management services
                </div>
                <div class="meta">H3 · 20/26 · 600</div>
            </div>
            <div class="row2">
                <div
                    class="spec"
                    style="font-size:17px;font-weight:600;line-height:1.3"
                >
                    NARA-aligned schedules
                </div>
                <div class="meta">H4 · 17/22 · 600</div>
            </div>
            <div class="row2">
                <div
                    class="spec"
                    style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3)"
                >
                    Past Performance
                </div>
                <div class="meta">Eyebrow · 12 · 600 · +14% tracking</div>
            </div>
        </div>
    </body>
</html>
