<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Header / nav</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .card {
            padding: 0;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-1);
            background: #fff;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .logo img {
            height: 28px;
        }
        .links {
            display: flex;
            gap: 22px;
            flex-shrink: 0;
        }
        .links a {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg-2);
            text-decoration: none;
        }
        .links a.active {
            color: var(--fg-1);
        }
        .spacer {
            flex: 1;
        }
        .cta {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            background: #16263d;
            color: #fff;
            border-radius: 4px;
            border: 0;
            cursor: pointer;
            flex-shrink: 0;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="nav">
                <div class="logo">
                    <img
                        src="../assets/logo-horizontal-2c.png"
                        alt="Ivyhill Technologies"
                    >
                </div>
                <div class="links">
                    <a class="active">Capabilities</a>
                    <a>Past work</a>
                    <a>Contracts</a>
                    <a>About</a>
                </div>
                <div class="spacer"></div>
                <button class="cta">Capability statement</button>
            </div>
        </div>
    </body>
</html>
