<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Display type</title>
        <link rel="stylesheet" href="_card.css">
        <style>
        .spec {
            padding: 4px 0;
        }
        .specimen {
            color: var(--fg-1);
            font-family: var(--font-display);
            letter-spacing: -0.02em;
            line-height: 1.05;
            font-weight: 700;
        }
        .meta {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--fg-4);
            margin-top: 6px;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="spec">
                <div class="specimen" style="font-size:56px">
                    Federal mission, delivered.
                </div>
                <div class="meta">
                    Inter · 700 · 56/58 · -2% tracking · --fs-display
                </div>
            </div>
            <div class="spec" style="margin-top:18px">
                <div class="specimen" style="font-size:38px; font-weight:700">
                    Enterprise Information Management
                </div>
                <div class="meta">
                    Inter · 700 · 38/44 · -1% tracking · --fs-h1
                </div>
            </div>
        </div>
    </body>
</html>
