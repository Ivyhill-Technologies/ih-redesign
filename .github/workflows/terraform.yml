# Runs `terraform plan` on PRs that touch infra/, so reviewers see exactly
# what a PR would do to AWS before a human applies it. CI never applies.
# Runs on every PR (so it can be a required check) but skips in seconds when
# infra/ is untouched. Drift on main is watched separately (drift.yml).
# Plan output is public (public repo); Terraform masks sensitive values.
name: Terraform plan

on:
    pull_request:
        branches: [main]

permissions:
    contents: read
    id-token: write # to assume the read-only AWS role via OIDC

concurrency:
    group: tf-${{ github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infra
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Does this PR touch infra/?
              id: changes
              working-directory: .
              run: |
                  if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- infra .github/workflows/terraform.yml; then
                      echo "infra=false" >> "$GITHUB_OUTPUT"
                      echo "No changes under infra/, nothing to plan." >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "infra=true" >> "$GITHUB_OUTPUT"
                  fi
            - uses: hashicorp/setup-terraform@v4
              if: steps.changes.outputs.infra == 'true'
              with:
                  terraform_version: "~1.15"
                  terraform_wrapper: false
            - uses: aws-actions/configure-aws-credentials@v6
              if: steps.changes.outputs.infra == 'true'
              with:
                  role-to-assume: arn:aws:iam::860184462664:role/ih-redesign-terraform-plan
                  aws-region: us-east-1
            - run: terraform fmt -check -diff
              if: steps.changes.outputs.infra == 'true'
            - run: terraform init -input=false
              if: steps.changes.outputs.infra == 'true'
            - run: terraform validate
              if: steps.changes.outputs.infra == 'true'
            # -lock=false: the role can't write the S3 lock file, and plan doesn't change state.
            - name: Plan
              if: steps.changes.outputs.infra == 'true'
              run: |
                  terraform plan -input=false -lock=false -no-color | tee plan.txt
                  { echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
