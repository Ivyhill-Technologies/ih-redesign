# Light PR check: lint for real bugs and make sure the site builds.
# Formatting is not enforced here; run `npx biome check --write .` locally.
name: CI

on:
    pull_request:
        branches: [main]

# Read-only token. PRs from forks never get secrets either way.
permissions:
    contents: read

# A newer push to the same PR cancels the older run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  cache: true
            - uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: npm-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-
            - run: npm ci --no-audit --no-fund
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build
