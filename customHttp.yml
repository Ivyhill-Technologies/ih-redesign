# Response headers for every file Amplify Hosting serves. Amplify reads this
# file from the repo root on each deploy (it overrides the console setting).
#
# CSP notes:
# - 'unsafe-inline' for scripts: vite-react-ssg inlines two small scripts per
#   page (hydration data and a build hash) that change every build.
# - connect-src must include the contact form Lambda (CONTACT_URL in src/config.js).
#
# HSTS deliberately has no includeSubDomains/preload: other ivyhilltech.com
# subdomains (dev, corp, mail, ...) are not ours to force onto HTTPS.
customHeaders:
    - pattern: "**"
      headers:
          - key: Strict-Transport-Security
            value: max-age=31536000
          - key: Content-Security-Policy
            value: >-
                default-src 'self';
                script-src 'self' 'unsafe-inline';
                style-src 'self' 'unsafe-inline';
                img-src 'self' data:;
                font-src 'self';
                connect-src 'self' https://udhccr6nxn422hdz5v2gnhrezm0ciydp.lambda-url.us-east-1.on.aws;
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none';
                upgrade-insecure-requests
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
          - key: Cross-Origin-Opener-Policy
            value: same-origin
